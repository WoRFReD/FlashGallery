# Version 1.01 - FlashGallery
# Developed for FlashChip by WoRFReD

# Aumentar memoria JVM para evitar pausas de Garbage Collector durante la compilación
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Compilación paralela de tareas de Gradle y Kotlin
org.gradle.parallel=true

# Activar caché de build entre compilaciones (evita recompilar lo que no ha cambiado)
org.gradle.caching=true

# Observación de cambios en sistema de archivos en Windows para no re-escanear todo el disco
org.gradle.vfs.watch=true

# Compilación incremental de Kotlin
kotlin.incremental=true

# Android flags
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
